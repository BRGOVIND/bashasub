[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhashasub"
version = "0.1.0.dev0"
description = "A subtitle conformance linter with script-aware measurement."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

# The core deliberately depends on `regex` alone. Python's stdlib `re` cannot
# match grapheme clusters (`\X`), which script-aware measurement requires.
# Everything else is an optional extra so that `pip install bhashasub` yields a
# tool that runs offline with no API key and no web framework.
dependencies = ["regex>=2023.0.0"]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "jinja2>=3",
]
ai = ["httpx>=0.27", "tenacity>=9"]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." keeps the existing root-level app (main.py, config.py) importable so the
# security suite and the live /translate endpoint keep working unchanged.
pythonpath = ["src", "."]
testpaths = ["tests"]
